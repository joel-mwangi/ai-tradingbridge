name: Python strategy tests

on:
  push:
    paths:
      - "app/strategy/**"
      - "tests/test_digit_strategy.py"
      - "tests/test_feed_health.py"
      - "tests/test_strategy_session.py"
      - "tests/test_live_strategy_feed.py"
      - "tests/test_market_frequency_adapter.py"
      - ".github/workflows/python-strategy-tests.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "app/strategy/**"
      - "tests/test_digit_strategy.py"
      - "tests/test_feed_health.py"
      - "tests/test_strategy_session.py"
      - "tests/test_live_strategy_feed.py"
      - "tests/test_market_frequency_adapter.py"
      - ".github/workflows/python-strategy-tests.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digit-strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run digit strategy tests
        run: python -m pytest tests/test_digit_strategy.py tests/test_feed_health.py tests/test_strategy_session.py tests/test_market_frequency_adapter.py tests/test_live_strategy_feed.py -v
