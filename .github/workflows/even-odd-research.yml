name: Even/Odd adaptive pattern research

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Deriv market symbol
        required: true
        type: choice
        options:
          - R_50
          - R_75
          - 1HZ100V
          - 1HZ75V
      limit:
        description: Maximum live-captured observations used in research (runner caps at 5000)
        required: true
        default: "5000"
        type: choice
        options:
          - "3000"
          - "4000"
          - "5000"

permissions:
  contents: read

concurrency:
  group: even-odd-research-${{ inputs.symbol }}
  cancel-in-progress: false

jobs:
  research:
    name: Discover conditional patterns and occurrence probabilities
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVEN_ODD_SUPABASE_URL: ${{ secrets.EVEN_ODD_SUPABASE_URL }}
      EVEN_ODD_SUPABASE_SECRET_KEY: ${{ secrets.EVEN_ODD_SUPABASE_SECRET_KEY }}
      SYMBOL: ${{ inputs.symbol }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify dedicated database credentials
        shell: bash
        run: |
          if [[ -z "$EVEN_ODD_SUPABASE_URL" || -z "$EVEN_ODD_SUPABASE_SECRET_KEY" ]]; then
            echo "::error::Configure EVEN_ODD_SUPABASE_URL and EVEN_ODD_SUPABASE_SECRET_KEY as GitHub Actions secrets."
            exit 1
          fi

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Discover adaptive conditional patterns
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.even_odd_research \
            --symbol "$SYMBOL" \
            --limit "$LIMIT" | tee even-odd-pattern-research-report.json

      - name: Upload pattern research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: even-odd-pattern-research-${{ inputs.symbol }}-${{ github.run_id }}
          path: |
            even-odd-pattern-research-report.json
          if-no-files-found: ignore
          retention-days: 90
